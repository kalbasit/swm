name: Releases
permissions:
  contents: read
on:
  push:
    tags:
      - "v*.*.*"
jobs:
  flake-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: swm
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The tag reaches the build from the pushed ref, never from a value
      # committed to the repo: a flake's `self` exposes no ref, so this is the
      # only point where the build can learn which release it is.
      - name: Create version file
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # The trigger glob `v*.*.*` is looser than a semantic version: it also
          # matches refs like `v1.2.3.4`. Refusing those here is the point --
          # silently skipping would build a revision-stamped artifact and
          # release it as a version, which is the failure this wiring exists to
          # prevent. Each pre-release and build-metadata identifier must be
          # non-empty, so `v1.2.3-rc..1` and `v1.2.3+build.` are refused too.
          semver='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$REF_NAME" =~ $semver ]]; then
            echo "::error::tag '$REF_NAME' is not a semantic version, so the build cannot report it; not releasing"
            exit 1
          fi
          echo "$REF_NAME" > nix/packages/swm/version.txt
      - name: Flake check
        run: nix flake check -L
  release:
    runs-on: ubuntu-24.04
    needs: flake-check
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Release with Notes
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          append_body: true
          body: |
            ${{ (contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc')) && '> [!WARNING]
            > This is a pre-release version and should not be used in production. Your data may be lost or corrupted.
            > Please use the latest release for production environments.
            ' || '' }}
