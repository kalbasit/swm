name: Releases
permissions:
  contents: read
on:
  push:
    tags:
      - "v*.*.*"
jobs:
  flake-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: swm
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The tag reaches the build from the pushed ref, never from a value
      # committed to the repo: a flake's `self` exposes no ref, so this is the
      # only point where the build can learn which release it is.
      - name: Create version file
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "$REF_NAME" > nix/packages/swm/version.txt
          fi
      - name: Flake check
        run: nix flake check -L
  release:
    runs-on: ubuntu-24.04
    needs: flake-check
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Release with Notes
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          append_body: true
          body: |
            ${{ (contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc')) && '> [!WARNING]
            > This is a pre-release version and should not be used in production. Your data may be lost or corrupted.
            > Please use the latest release for production environments.
            ' || '' }}
